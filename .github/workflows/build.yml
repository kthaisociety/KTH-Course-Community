# Every push to main: lint, test and typecheck, build and push
# ghcr.io/kthaisociety/kth-course-community:sha-<7>, then deploy it to staging through
# kthaisociety/deployments, and wait until it runs there. release.yml waits for this workflow's run of a
# release commit (so a release is promoted only after it ran on staging): the two stay separate files.
name: build

on:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: "2.2.6"
      - run: biome ci .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom 30 (component tests) needs >=22.22; undici 8 calls
          # worker_threads.markAsUncloneable, added in Node 22.10.
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test:web

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom 30 (component tests) needs >=22.22; undici 8 calls
          # worker_threads.markAsUncloneable, added in Node 22.10.
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    needs: [quality, test, typecheck]
    uses: kthaisociety/workflows/.github/workflows/build.yml@v0.3.0
    with:
      dockerfile: Dockerfile.web
    permissions:
      contents: read
      packages: write

  deploy-staging:
    needs: build
    uses: kthaisociety/workflows/.github/workflows/request-deploy.yml@v0.3.0
    with:
      environment: staging
      tag: ${{ needs.build.outputs.tag }}
    secrets:
      dispatch-app-client-id: ${{ secrets.DISPATCH_APP_CLIENT_ID }}
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
